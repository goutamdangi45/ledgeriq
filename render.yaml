# Render Blueprint: one-click deploy of the web app + PostgreSQL database.
services:
  - type: web
    name: ledgeriq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgeriq-db
          property: connectionString
databases:
  - name: ledgeriq-db
    plan: free
